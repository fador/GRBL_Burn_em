<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Code Laser Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { 
            image-rendering: pixelated; 
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .g-code-input {
            font-family: 'Consolas', 'Monaco', monospace;
            white-space: pre;
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 text-white p-4 shadow-md shrink-0 flex justify-between items-center z-10">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <svg class="w-6 h-6 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            Laser G-Code Simulator
        </h1>
        <div class="text-sm text-slate-400" id="status-display">Ready</div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar / Editor -->
        <div class="w-1/3 bg-white border-r border-slate-300 flex flex-col min-w-[300px] z-10 shadow-lg">
            <div class="p-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h2 class="font-semibold text-slate-700">G-Code Input</h2>
                <div class="flex gap-2">
                    <button onclick="loadSample()" class="text-xs text-blue-600 hover:text-blue-800 underline">Load Sample</button>
                    <button onclick="clearInput()" class="text-xs text-red-600 hover:text-red-800 underline">Clear</button>
                </div>
            </div>
            
            <textarea id="gcode-input" class="flex-1 w-full p-4 resize-none bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs g-code-input text-slate-700" spellcheck="false" placeholder="Paste G-code here..."></textarea>
            
            <div class="p-4 border-t border-slate-200 bg-slate-50">
                
                <div class="mb-4 space-y-3">
                    <div class="flex items-center justify-between">
                         <label class="text-xs font-medium text-slate-500">Visualization Options</label>
                         <button onclick="fitToView()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1 rounded transition">Reset View</button>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="show-traversals" checked onchange="draw()" class="rounded text-blue-600 focus:ring-blue-500 h-4 w-4 border-gray-300">
                        <label for="show-traversals" class="text-sm text-slate-700 select-none cursor-pointer">Show Travel Moves (G0)</label>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Max S-Value (Power)</label>
                        <input type="number" id="max-power" value="1000" class="w-full px-2 py-1 border rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Stroke Width</label>
                        <input type="number" id="stroke-width" value="2" step="0.5" class="w-full px-2 py-1 border rounded text-sm">
                    </div>
                </div>
                <button onclick="runSimulation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow transition">
                    Simulate / Update
                </button>
            </div>
        </div>

        <!-- Canvas Viewport -->
        <div class="flex-1 relative bg-slate-200 flex flex-col items-center justify-center overflow-hidden">
            <!-- Canvas Container -->
            <div class="relative w-full h-full bg-slate-100 overflow-hidden" id="canvas-container">
                <canvas id="sim-canvas" class="block w-full h-full"></canvas>
                
                <!-- Overlay Info -->
                <div class="absolute bottom-4 right-4 bg-white/90 shadow-lg border border-slate-200 text-slate-600 text-xs px-3 py-2 rounded pointer-events-none select-none backdrop-blur-sm" id="canvas-info">
                    Scale: 1.0x <br> Pan: 0, 0
                </div>

                <!-- Instructions Overlay -->
                <div class="absolute top-4 left-4 text-slate-400 text-xs pointer-events-none select-none">
                    Scroll to Zoom • Drag to Pan
                </div>
            </div>
        </div>
    </div>

<script>
    // Configuration & Refs
    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d');
    const inputArea = document.getElementById('gcode-input');
    const statusDisplay = document.getElementById('status-display');
    const maxPowerInput = document.getElementById('max-power');
    const strokeWidthInput = document.getElementById('stroke-width');
    const canvasInfo = document.getElementById('canvas-info');
    const showTraversalsInput = document.getElementById('show-traversals');
    const container = document.getElementById('canvas-container');

    // Default Sample
    const sampleGCode = `G21
G90
M4 S0
G0 F1000
G0 X70.482 Y179.814
G1 X125.698 S0
G1 X126.121 S85
G1 X126.262 S105
G1 X126.825 S170
G1 X126.966 S194
G1 X127.952 S259
G1 X130.910 S0
G1 X131.896 S262
G1 X132.037 S193
G1 X132.600 S174
G1 X132.741 S108
G1 X133.164 S85
G1 X188.380 S0
G0 X70.482 Y179.675
G1 X123.867 S0
G1 X124.149 S89
G1 X124.290 S110
G1 X124.571 S174
G1 X124.712 S194
G1 X125.135 S255
G1 X133.727 S0
G1 X134.150 S255
G1 X134.291 S193
G1 X134.572 S174
G1 X134.713 S108
G1 X134.995 S85
G1 X188.380 S0
G0 X70.482 Y179.537
G1 X122.599 S0
G1 X122.740 S89
G1 X122.881 S109`;

    // Application State
    let paths = [];
    let bounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
    
    // Viewport State
    let view = {
        scale: 1,
        panX: 0,
        panY: 0,
        isDragging: false,
        lastMouseX: 0,
        lastMouseY: 0
    };

    // --- Parsing Logic ---

    function parseGCode(code) {
        const lines = code.split('\n');
        const segments = [];
        
        let state = {
            x: 0,
            y: 0,
            s: 0,
            mode: 'G0',
            isRelative: false
        };

        bounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };

        const updateBounds = (x, y) => {
            if (x < bounds.minX) bounds.minX = x;
            if (x > bounds.maxX) bounds.maxX = x;
            if (y < bounds.minY) bounds.minY = y;
            if (y > bounds.maxY) bounds.maxY = y;
        };
        
        // Track if bounds were actually updated to handle empty files
        let hasMoves = false; 
        updateBounds(0, 0); // Start at origin

        lines.forEach(line => {
            line = line.trim().toUpperCase();
            const commentIndex = line.indexOf(';');
            if (commentIndex !== -1) line = line.substring(0, commentIndex);
            const parenIndex = line.indexOf('(');
            if (parenIndex !== -1) line = line.substring(0, parenIndex);
            
            if (!line) return;

            const parts = line.split(/\s+/);
            
            let nextX = state.x;
            let nextY = state.y;
            let nextS = state.s;
            let hasMove = false;

            parts.forEach(part => {
                const letter = part.charAt(0);
                const value = parseFloat(part.substring(1));
                if (isNaN(value)) return;

                switch (letter) {
                    case 'G':
                        if (value === 0) state.mode = 'G0';
                        if (value === 1) state.mode = 'G1';
                        if (value === 90) state.isRelative = false;
                        if (value === 91) state.isRelative = true;
                        break;
                    case 'X':
                        nextX = state.isRelative ? state.x + value : value;
                        hasMove = true;
                        break;
                    case 'Y':
                        nextY = state.isRelative ? state.y + value : value;
                        hasMove = true;
                        break;
                    case 'S':
                        nextS = value;
                        break;
                }
            });

            if (hasMove) {
                segments.push({
                    x1: state.x,
                    y1: state.y,
                    x2: nextX,
                    y2: nextY,
                    power: state.mode === 'G0' ? 0 : nextS,
                    type: state.mode
                });
                updateBounds(nextX, nextY);
                state.x = nextX;
                state.y = nextY;
                hasMoves = true;
            }
            state.s = nextS;
        });

        if (!hasMoves) {
            bounds = { minX: 0, minY: 0, maxX: 100, maxY: 100 };
        }

        return segments;
    }

    // --- Interactive Viewport Logic ---

    function handleResize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        draw();
    }

    function fitToView() {
        if (paths.length === 0) return;

        const width = canvas.width;
        const height = canvas.height;
        const padding = 40;

        const dataWidth = bounds.maxX - bounds.minX;
        const dataHeight = bounds.maxY - bounds.minY;
        
        if (dataWidth === 0 && dataHeight === 0) {
            view.scale = 1;
            view.panX = width / 2;
            view.panY = height / 2;
        } else {
            const scaleX = (width - padding * 2) / dataWidth;
            const scaleY = (height - padding * 2) / dataHeight;
            view.scale = Math.min(scaleX, scaleY);
            
            // Center logic
            // ScreenX = WorldX * scale + PanX
            // We want bounds.minX to map to left padding
            // PanX = Padding - bounds.minX * scale
            // Centered X:
            view.panX = (width - dataWidth * view.scale) / 2 - bounds.minX * view.scale;
            view.panY = (height - dataHeight * view.scale) / 2 - bounds.minY * view.scale;
        }
        draw();
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', e => {
            view.isDragging = true;
            view.lastMouseX = e.clientX;
            view.lastMouseY = e.clientY;
        });

        window.addEventListener('mousemove', e => {
            if (!view.isDragging) return;
            const dx = e.clientX - view.lastMouseX;
            const dy = e.clientY - view.lastMouseY;
            
            view.panX += dx;
            // Since we flip Y in rendering, we pan "visually". 
            // If we drag mouse down (positive DY), we want the image to move down.
            // Rendering is: Y_screen = height - (Y_world * scale + panY)
            // To move image DOWN (increase Y_screen), we must DECREASE panY.
            view.panY -= dy; 

            view.lastMouseX = e.clientX;
            view.lastMouseY = e.clientY;
            draw();
        });

        window.addEventListener('mouseup', () => {
            view.isDragging = false;
        });

        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            
            // Calculate mouse position in "World Space" before zoom
            // ScreenX = WorldX * scale + PanX  =>  WorldX = (ScreenX - PanX) / scale
            // ScreenY = H - (WorldY * scale + PanY) => WorldY * scale + PanY = H - ScreenY => WorldY = (H - ScreenY - PanY) / scale
            
            const worldMouseX = (mouseX - view.panX) / view.scale;
            const worldMouseY = (canvas.height - mouseY - view.panY) / view.scale;

            // Apply Zoom
            view.scale *= zoomFactor;

            // Adjust Pan to keep mouse in same world position
            // PanX = ScreenX - WorldX * newScale
            view.panX = mouseX - worldMouseX * view.scale;
            // PanY = H - ScreenY - WorldY * newScale
            view.panY = (canvas.height - mouseY) - worldMouseY * view.scale;

            draw();
        }, { passive: false });
    }

    // --- Rendering Logic ---

    function draw() {
        const width = canvas.width;
        const height = canvas.height;
        const maxS = parseFloat(maxPowerInput.value) || 255;
        const strokeW = parseFloat(strokeWidthInput.value) || 2;
        const showRapids = showTraversalsInput.checked;

        // Clear background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);

        // Draw Grid
        drawGrid(width, height);

        if (paths.length === 0) return;

        // Draw Origin Indicator
        drawOrigin(height);

        // Update Info
        canvasInfo.innerHTML = `Scale: ${view.scale.toFixed(2)}x <br> Pan: ${Math.round(view.panX)}, ${Math.round(view.panY)}`;

        // Draw Paths
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        paths.forEach(segment => {
            if (!showRapids && (segment.type === 'G0' || segment.power === 0)) {
                return;
            }

            const x1 = segment.x1 * view.scale + view.panX;
            const y1 = height - (segment.y1 * view.scale + view.panY);
            const x2 = segment.x2 * view.scale + view.panX;
            const y2 = height - (segment.y2 * view.scale + view.panY);

            // Optimization: Cull lines completely off screen
            if (Math.max(x1, x2) < 0 || Math.min(x1, x2) > width || Math.max(y1, y2) < 0 || Math.min(y1, y2) > height) {
                return;
            }

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);

            if (segment.type === 'G0') {
                ctx.strokeStyle = 'rgba(50, 200, 100, 0.4)';
                ctx.lineWidth = 1 / Math.max(1, Math.log10(view.scale)); // Keep rapid lines thin
                ctx.setLineDash([5, 5]);
            } else {
                const intensity = Math.min(segment.power / maxS, 1);
                if (intensity <= 0.01) {
                    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
                } else {
                    ctx.strokeStyle = `rgba(40, 20, 10, ${intensity})`; 
                }
                ctx.lineWidth = strokeW * Math.sqrt(view.scale); // Scale line width slightly with zoom
                ctx.setLineDash([]);
            }
            ctx.stroke();
        });
    }

    function drawGrid(w, h) {
        const gridSize = 10 * view.scale; // 10mm grid
        
        // If grid is too dense, don't draw or scale it up
        if (gridSize < 5) return;
        
        const step = gridSize < 20 ? gridSize * 5 : gridSize;

        ctx.beginPath();
        ctx.strokeStyle = '#f0f0f0';
        ctx.lineWidth = 1;

        // Offset grid based on pan
        const startX = view.panX % step;
        const startY = (h - view.panY) % step;

        for (let x = startX; x < w; x += step) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
        }
        // Since we flip Y, the visual grid moves oppositely to panY if we did simple mod.
        // We need visual grid lines to stick to world coordinates.
        // World Y=0 => Screen Y = H - PanY.
        // World Y=10 => Screen Y = H - (10*Scale + PanY).
        
        // Let's just iterate screen pixels
        // Y in world space corresponding to screen 0 is: (H - 0 - PanY)/Scale
        // We want to find lines where WorldY % 10 == 0
        
        // Simplified grid: just draw a static grid relative to screen? No, should move with world.
        // Let's iterate world units.
        
        // Calculate World bounds visible
        const worldLeft = -view.panX / view.scale;
        const worldRight = (w - view.panX) / view.scale;
        const worldBottom = (-view.panY) / view.scale; // bottom of world relative to visual render (screen H)
        const worldTop = (h - view.panY) / view.scale; // Actually inverted due to flip
        
        // It's getting complex to do perfect grid in loop, let's just stick to a visual grid that moves with Pan
        // Vertical lines (X):
        const gridStepWorld = 50; // 50mm lines
        const offsetX = view.panX;
        
        // Find first multiple of gridStepWorld visible
        const firstMultipleX = Math.floor(worldLeft / gridStepWorld) * gridStepWorld;
        
        for (let wx = firstMultipleX; ; wx += gridStepWorld) {
            const screenX = wx * view.scale + view.panX;
            if (screenX > w) break;
            ctx.moveTo(screenX, 0);
            ctx.lineTo(screenX, h);
        }

        // Horizontal lines (Y):
        // ScreenY = H - (WorldY * scale + PanY)
        // WorldY = (H - ScreenY - PanY) / Scale
        // Visible WorldY range:
        const wyMin = (h - h - view.panY) / view.scale * -1; // roughly
        const wyMax = (h - 0 - view.panY) / view.scale * -1; // roughly
        // The flip makes the min/max logic tricky, let's just iterate broadly
        
        // Simple approach: Iterate Screen Y based on world step
        const firstMultipleY = Math.floor(((h - view.panY)/view.scale)/gridStepWorld)*gridStepWorld; 
        // Iterate downwards (decreasing Y in world means increasing Y in screen)
        
        // Just brute force a safe range based on viewport height, it's cheap
        const startWorldY = Math.floor(((h - view.panY) / view.scale) / gridStepWorld) * gridStepWorld + gridStepWorld;
        const endWorldY = Math.floor(((- view.panY) / view.scale) / gridStepWorld) * gridStepWorld - gridStepWorld;

        for (let wy = startWorldY; wy >= endWorldY; wy -= gridStepWorld) {
            const screenY = h - (wy * view.scale + view.panY);
            ctx.moveTo(0, screenY);
            ctx.lineTo(w, screenY);
        }

        ctx.stroke();
    }

    function drawOrigin(h) {
        const ox = view.panX;
        const oy = h - view.panY;
        
        ctx.beginPath();
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 2;
        // X axis red
        ctx.moveTo(ox, oy);
        ctx.lineTo(ox + 20, oy);
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = 'green';
        // Y axis green (Up)
        ctx.moveTo(ox, oy);
        ctx.lineTo(ox, oy - 20);
        ctx.stroke();
    }

    // --- UI Handlers ---

    function runSimulation() {
        const code = inputArea.value;
        paths = parseGCode(code);
        
        let detectedMaxS = 0;
        paths.forEach(p => { if(p.power > detectedMaxS) detectedMaxS = p.power; });
        
        statusDisplay.innerText = `Segments: ${paths.length}. X:[${bounds.minX.toFixed(1)}, ${bounds.maxX.toFixed(1)}] Y:[${bounds.minY.toFixed(1)}, ${bounds.maxY.toFixed(1)}]`;
        
        fitToView();
    }

    function loadSample() {
        inputArea.value = sampleGCode;
        maxPowerInput.value = 1000; 
        runSimulation();
    }

    function clearInput() {
        inputArea.value = '';
        paths = [];
        ctx.clearRect(0,0, canvas.width, canvas.height);
        statusDisplay.innerText = 'Cleared';
        bounds = { minX: 0, minY: 0, maxX: 100, maxY: 100 }; // Reset
        fitToView();
    }

    // Init
    window.addEventListener('resize', handleResize);
    setupInteraction();
    
    // Initial Size
    handleResize();
    
    // Load sample on start
    setTimeout(loadSample, 100); // Slight delay to ensure canvas size is ready

</script>
</body>
</html>
